<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 14px;
            opacity: 0.8;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .clock-city {
            color: #64b5f6;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .clock-time {
            font-size: 48px;
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
        }

        .clock-date {
            font-size: 12px;
            color: #b3e5fc;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .clock-timezone {
            font-size: 11px;
            color: #81d4fa;
            opacity: 0.7;
            background: rgba(0, 0, 0, 0.2);
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
        }

        .analog-clock {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            border: 3px solid #64b5f6;
            position: relative;
            margin: 15px auto;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }

        .clock-center {
            width: 12px;
            height: 12px;
            background: #64b5f6;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            box-shadow: 0 0 10px rgba(100, 181, 246, 0.8);
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            background: white;
            border-radius: 10px;
        }

        .hour-hand {
            width: 6px;
            height: 40px;
            margin-left: -3px;
            background: #64b5f6;
        }

        .minute-hand {
            width: 4px;
            height: 50px;
            margin-left: -2px;
            background: #81d4fa;
        }

        .second-hand {
            width: 2px;
            height: 55px;
            margin-left: -1px;
            background: #ff6b6b;
        }

        .clock-number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 12px;
            color: #b3e5fc;
            font-weight: bold;
        }

        .clock-number span {
            display: inline-block;
            position: absolute;
            left: 50%;
            width: 100%;
            height: 100%;
        }

        .controls {
            text-align: center;
            margin-top: 30px;
        }

        .control-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #64b5f6 0%, #42a5f5 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(66, 165, 245, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(66, 165, 245, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .button-add {
            background: linear-gradient(135deg, #66bb6a 0%, #43a047 100%);
            box-shadow: 0 4px 15px rgba(67, 160, 71, 0.4);
        }

        .button-add:hover {
            box-shadow: 0 6px 20px rgba(67, 160, 71, 0.6);
        }

        .button-remove {
            background: linear-gradient(135deg, #ef5350 0%, #e53935 100%);
            box-shadow: 0 4px 15px rgba(229, 57, 53, 0.4);
        }

        .button-remove:hover {
            box-shadow: 0 6px 20px rgba(229, 57, 53, 0.6);
        }

        .timezone-input {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 16px;
            border-radius: 50px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            text-align: center;
            font-family: 'Courier New', monospace;
        }

        .timezone-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .timezone-input:focus {
            outline: none;
            border-color: #64b5f6;
            box-shadow: 0 0 0 3px rgba(100, 181, 246, 0.2);
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 107, 107, 0.8);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            padding: 0;
        }

        .clock-card:hover .remove-btn {
            display: flex;
        }

        .remove-btn:hover {
            background: rgba(255, 107, 107, 1);
            transform: scale(1.1);
        }

        .clock-card {
            position: relative;
        }

        .info {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .clock-time {
                font-size: 36px;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .control-buttons {
                flex-direction: column;
            }

            button, .timezone-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🕐 Digital Clock</h1>
            <p>Waktu Real-Time di Berbagai Zona Waktu</p>
        </div>

        <div class="clocks-grid" id="clocksGrid">
            <!-- Clock cards akan ditambahkan di sini -->
        </div>

        <div class="controls">
            <div class="control-buttons">
                <input type="text" class="timezone-input" id="timezoneInput" placeholder="Contoh: Asia/Jakarta, Europe/London, America/New_York">
                <button class="button-add" onclick="addTimezone()">➕ Tambah Zona Waktu</button>
                <button onclick="resetToDefault()">🔄 Reset Default</button>
            </div>
            <div class="info">
                💡 Tip: Masukkan timezone dalam format IANA (contoh: Asia/Jakarta, Europe/Paris, America/Los_Angeles)
            </div>
        </div>
    </div>

    <script>
        // Default timezones
        const defaultTimezones = [
            { city: 'Jakarta', timezone: 'Asia/Jakarta' },
            { city: 'Tokyo', timezone: 'Asia/Tokyo' },
            { city: 'London', timezone: 'Europe/London' },
            { city: 'New York', timezone: 'America/New_York' },
            { city: 'Sydney', timezone: 'Australia/Sydney' },
            { city: 'Dubai', timezone: 'Asia/Dubai' }
        ];

        let timezones = [...defaultTimezones];

        // Load dari localStorage
        function loadTimezones() {
            const saved = localStorage.getItem('timezones');
            if (saved) {
                try {
                    timezones = JSON.parse(saved);
                } catch (e) {
                    timezones = [...defaultTimezones];
                }
            }
        }

        // Save ke localStorage
        function saveTimezones() {
            localStorage.setItem('timezones', JSON.stringify(timezones));
        }

        function updateClock(timezone, cardElement) {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('id-ID', {
                timeZone: timezone,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            const parts = formatter.formatToParts(now);
            const time = parts.map(p => {
                if (p.type === 'hour' || p.type === 'minute' || p.type === 'second') {
                    return p.value;
                }
                return '';
            }).join(':');

            const dateFormatter = new Intl.DateTimeFormat('id-ID', {
                timeZone: timezone,
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            const date = dateFormatter.format(now);

            const timeElement = cardElement.querySelector('.clock-time');
            const dateElement = cardElement.querySelector('.clock-date');
            if (timeElement) timeElement.textContent = time;
            if (dateElement) dateElement.textContent = date;

            // Update analog clock
            updateAnalogClock(timezone, cardElement, now);
        }

        function updateAnalogClock(timezone, cardElement, now) {
            const formatter = new Intl.DateTimeFormat('id-ID', {
                timeZone: timezone,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            const parts = formatter.formatToParts(now);
            let hour = 0, minute = 0, second = 0;

            parts.forEach(p => {
                if (p.type === 'hour') hour = parseInt(p.value);
                if (p.type === 'minute') minute = parseInt(p.value);
                if (p.type === 'second') second = parseInt(p.value);
            });

            const hourHand = cardElement.querySelector('.hour-hand');
            const minuteHand = cardElement.querySelector('.minute-hand');
            const secondHand = cardElement.querySelector('.second-hand');

            if (hourHand) {
                const hourDegrees = (hour % 12 + minute / 60) * 30;
                hourHand.style.transform = `rotate(${hourDegrees}deg)`;
            }

            if (minuteHand) {
                const minuteDegrees = (minute + second / 60) * 6;
                minuteHand.style.transform = `rotate(${minuteDegrees}deg)`;
            }

            if (secondHand) {
                const secondDegrees = second * 6;
                secondHand.style.transform = `rotate(${secondDegrees}deg)`;
            }
        }

        function renderClocks() {
            const grid = document.getElementById('clocksGrid');
            grid.innerHTML = '';

            timezones.forEach((tz, index) => {
                const card = document.createElement('div');
                card.className = 'clock-card';
                card.innerHTML = `
                    <button class="remove-btn" onclick="removeTimezone(${index})">✕</button>
                    <div class="clock-city">${tz.city}</div>
                    
                    <div class="analog-clock">
                        <div class="clock-center"></div>
                        <div class="hour-hand hand"></div>
                        <div class="minute-hand hand"></div>
                        <div class="second-hand hand"></div>
                    </div>
                    
                    <div class="clock-time">00:00:00</div>
                    <div class="clock-date">Loading...</div>
                    <div class="clock-timezone">${tz.timezone}</div>
                `;
                grid.appendChild(card);

                // Update immediately
                updateClock(tz.timezone, card);
            });
        }

        function addTimezone() {
            const input = document.getElementById('timezoneInput');
            const value = input.value.trim();

            if (!value) {
                alert('Masukkan timezone yang valid!');
                return;
            }

            // Validasi timezone
            try {
                new Intl.DateTimeFormat('id-ID', { timeZone: value });
                const cityName = value.split('/')[1] || value;
                timezones.push({ city: cityName, timezone: value });
                saveTimezones();
                renderClocks();
                input.value = '';
                startClock();
            } catch (e) {
                alert('Timezone tidak valid! Gunakan format IANA seperti: Asia/Jakarta, Europe/London, dll');
            }
        }

        function removeTimezone(index) {
            timezones.splice(index, 1);
            saveTimezones();
            renderClocks();
        }

        function resetToDefault() {
            if (confirm('Apakah Anda yakin ingin kembali ke zona waktu default?')) {
                timezones = [...defaultTimezones];
                saveTimezones();
                renderClocks();
                startClock();
            }
        }

        function startClock() {
            renderClocks();
            setInterval(() => {
                const cards = document.querySelectorAll('.clock-card');
                cards.forEach((card, index) => {
                    if (index < timezones.length) {
                        updateClock(timezones[index].timezone, card);
                    }
                });
            }, 1000);
        }

        // Enter key to add timezone
        document.getElementById('timezoneInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTimezone();
            }
        });

        // Start the clock
        loadTimezones();
        startClock();
    </script>
</body>
</html>
