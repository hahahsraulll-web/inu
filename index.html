<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Ular Makan Buah — Ketuk untuk Arah</title>
<style>
  :root{
    --bg:#0f1724;
    --panel: rgba(255,255,255,0.06);
    --accent:#ff7a18;
    --text:#e6eef8;
  }
  html,body{
    height:100%;
    margin:0;
    background:linear-gradient(180deg,#021026 0%, #061428 100%);
    color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
    -webkit-tap-highlight-color: transparent;
  }
  .game-wrap{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  canvas{
    background:var(--panel);
    border-radius:12px;
    box-shadow: 0 10px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    touch-action: manipulation;
  }
  .hud{
    position: absolute;
    top:18px;
    left:18px;
    display:flex;
    gap:12px;
    align-items:center;
  }
  .score, .high{
    background: rgba(255,255,255,0.04);
    padding:8px 12px;
    border-radius:10px;
    font-weight:600;
    font-size:14px;
    color:var(--text);
    display:flex;
    gap:8px;
    align-items:center;
  }
  .overlay{
    position: absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .panel{
    background: rgba(1,7,23,0.6);
    border-radius:12px;
    padding:18px;
    text-align:center;
    color:var(--text);
    pointer-events:auto;
  }
  .panel h2{ margin:0 0 8px 0; font-size:20px; }
  .panel p{ margin:0 0 12px 0; color:#bcd2e6; font-size:14px; }
  .panel .big{ font-size:28px; font-weight:800; color:var(--accent); }
  .actions{ display:flex; gap:10px; justify-content:center; margin-top:8px; }
  .action-btn{
    padding:8px 12px;border-radius:8px;border:none;background:var(--accent);
    color:white;font-weight:700;cursor:pointer;
  }
  .hint{ position:absolute; bottom:18px; left:18px; color:#bcd2e6; font-size:13px; opacity:0.95; }
  @media (max-width:420px){
    .hint{ font-size:12px; }
  }
</style>
</head>
<body>
  <div class="game-wrap">
    <canvas id="c"></canvas>

    <div class="hud">
      <div class="score">Skor: <span id="score">0</span></div>
      <div class="high">High: <span id="high">0</span></div>
    </div>

    <div class="overlay" id="overlay" style="display:none;">
      <div class="panel" id="panel">
        <h2 id="panelTitle">Game Over</h2>
        <p id="panelText">Skor Anda: <span id="panelScore" class="big">0</span></p>
        <div class="actions">
          <button class="action-btn" id="restart">Main Lagi</button>
        </div>
      </div>
    </div>

    <div class="hint">Ketuk pada layar (di kiri/kanan/atas/bawah relatif kepala ular) untuk mengarahkan · Hindari menabrak</div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highEl = document.getElementById('high');
  const overlay = document.getElementById('overlay');
  const panelScore = document.getElementById('panelScore');
  const restartBtn = document.getElementById('restart');

  let DPR = Math.max(1, window.devicePixelRatio || 1);

  // Config: slower snake and no auto-speedup on eat
  let cellSize = 24;
  let cols = 20, rows = 20;
  let tickMs = 220;       // slower: movement interval in ms (higher => slower)
  const minTick = 80;
  const speedUp = 0;      // set 0 so eating tidak mempercepat (tetap pelan)
  let tickTimer = null;

  // State
  let snake = [];
  let dir = {x:1,y:0};
  let pendingDir = {x:1,y:0};
  let food = null;
  let score = 0;
  let high = 0;
  let running = false;

  function loadHigh(){ high = parseInt(localStorage.getItem('snake_high')||'0',10); highEl.textContent = high; }
  function saveHigh(){ if(score>high){ high = score; localStorage.setItem('snake_high', String(high)); highEl.textContent = high; } }

  function resizeCanvas(){
    const w = Math.min(window.innerWidth, window.innerHeight*0.9);
    const h = w;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);

    const targetCells = 20;
    cellSize = Math.max(12, Math.floor(w / targetCells));
    cols = Math.floor(w / cellSize);
    rows = Math.floor(h / cellSize);

    draw();
  }

  function resetGame(){
    score = 0;
    scoreEl.textContent = score;
    tickMs = 220;
    snake = [];
    const startX = Math.floor(cols/2);
    const startY = Math.floor(rows/2);
    snake.push({x:startX-1,y:startY});
    snake.push({x:startX,y:startY});
    snake.push({x:startX+1,y:startY});
    dir = {x:1,y:0};
    pendingDir = {x:1,y:0};
    placeFood();
    running = true;
    overlay.style.display = 'none';
    startTick();
  }

  function placeFood(){
    while(true){
      const f = { x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows) };
      if(!snake.some(s=>s.x===f.x && s.y===f.y)){
        food = f; break;
      }
    }
  }

  function startTick(){
    if(tickTimer) clearInterval(tickTimer);
    tickTimer = setInterval(update, tickMs);
  }

  function stopTick(){
    if(tickTimer) clearInterval(tickTimer);
    tickTimer = null;
  }

  function update(){
    if((pendingDir.x !== -dir.x || pendingDir.y !== -dir.y)) dir = pendingDir;
    const head = { x: (snake[snake.length-1].x + dir.x), y: (snake[snake.length-1].y + dir.y) };

    if(head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows){
      gameOver(); return;
    }

    if(snake.some(s=>s.x===head.x && s.y===head.y)){
      gameOver(); return;
    }

    snake.push(head);

    if(food && head.x===food.x && head.y===food.y){
      score += 1;
      scoreEl.textContent = score;
      placeFood();
      // no speed up (kecepatan tetap)
      // if you want slight speed increase, uncomment below:
      // tickMs = Math.max(minTick, tickMs - speedUp); startTick();
    } else {
      snake.shift();
    }

    draw();
  }

  function gameOver(){
    running = false;
    stopTick();
    saveHigh();
    panelScore.textContent = score;
    overlay.style.display = 'flex';
  }

  function draw(){
    const w = parseFloat(canvas.style.width);
    const h = parseFloat(canvas.style.height);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#071428';
    ctx.fillRect(0,0,w,h);

    const gridW = cols * cellSize;
    const gridH = rows * cellSize;
    const offsetX = Math.floor((w - gridW)/2);
    const offsetY = Math.floor((h - gridH)/2);

    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    for(let gx=0; gx<cols; gx++){
      for(let gy=0; gy<rows; gy++){
        if((gx+gy)%2===0){
          ctx.fillRect(offsetX + gx*cellSize, offsetY + gy*cellSize, cellSize, cellSize);
        }
      }
    }

    if(food){
      const fx = offsetX + food.x*cellSize;
      const fy = offsetY + food.y*cellSize;
      drawFruit(fx,fy,cellSize);
    }

    for(let i=0;i<snake.length;i++){
      const s = snake[i];
      const x = offsetX + s.x*cellSize;
      const y = offsetY + s.y*cellSize;
      if(i === snake.length-1){
        roundRect(ctx,x+2,y+2,cellSize-4,cellSize-4,6, '#ffb997');
        ctx.fillStyle = '#08202a';
        const prev = snake.length>1 ? snake[snake.length-2] : s;
        const hx = s.x - prev.x;
        const hy = s.y - prev.y;
        const ex = x + cellSize/2 + (hx*4);
        const ey = y + cellSize/2 + (hy*4);
        ctx.beginPath(); ctx.arc(ex,ey, Math.max(1, cellSize*0.08), 0, Math.PI*2); ctx.fill();
      } else {
        roundRect(ctx,x+2,y+2,cellSize-4,cellSize-4,5, '#ffd7b0');
      }
    }
  }

  function drawFruit(x,y,size){
    const pad = Math.max(2, Math.floor(size*0.12));
    const cx = x + size/2, cy = y + size/2;
    ctx.beginPath();
    ctx.fillStyle = '#ff5252';
    ctx.ellipse(cx, cy, (size/2)-pad, (size/2)-pad, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#2ecc71';
    ctx.beginPath();
    ctx.ellipse(cx + size*0.22, cy - size*0.35, size*0.12, size*0.06, -0.8, 0, Math.PI*2);
    ctx.fill();
  }

  function roundRect(ctx,x,y,w,h,r,color){
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y, x+w,y+h, r);
    ctx.arcTo(x+w,y+h, x,y+h, r);
    ctx.arcTo(x,y+h, x,y, r);
    ctx.arcTo(x,y, x+w,y, r);
    ctx.closePath();
    ctx.fill();
  }

  // Tap-to-direction control (ketukan)
  function handleTap(clientX, clientY){
    if(!running) return;
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;

    // compute grid offsets same as draw()
    const canvasW = rect.width;
    const canvasH = rect.height;
    const gridW = cols * cellSize;
    const gridH = rows * cellSize;
    const offsetX = Math.floor((canvasW - gridW)/2);
    const offsetY = Math.floor((canvasH - gridH)/2);

    const head = snake[snake.length-1];
    const headCX = offsetX + head.x*cellSize + cellSize/2;
    const headCY = offsetY + head.y*cellSize + cellSize/2;

    const dx = x - headCX;
    const dy = y - headCY;

    // If tap is very close (within cell), interpret relative to canvas center to avoid no-op:
    // choose larger absolute delta to determine direction
    if(Math.abs(dx) > Math.abs(dy)){
      trySetDir(dx>0?1:-1, 0);
    } else {
      trySetDir(0, dy>0?1:-1);
    }
  }

  // Touch handler: detect taps (not drags)
  let touchStartPos = null;
  canvas.addEventListener('touchstart', (e)=>{
    if(e.touches.length !== 1) return;
    const t = e.touches[0];
    touchStartPos = {x: t.clientX, y: t.clientY, time: Date.now()};
  }, {passive:true});

  canvas.addEventListener('touchend', (e)=>{
    const t = e.changedTouches[0];
    if(!touchStartPos) return;
    const dx = t.clientX - touchStartPos.x;
    const dy = t.clientY - touchStartPos.y;
    const dt = Date.now() - touchStartPos.time;
    touchStartPos = null;
    // treat as tap if small move or short time
    if(Math.hypot(dx,dy) < 30 && dt < 500){
      handleTap(t.clientX, t.clientY);
    }
  }, {passive:true});

  // Mouse click for desktop/testing
  canvas.addEventListener('click', (e)=>{
    handleTap(e.clientX, e.clientY);
  });

  // Keyboard arrows for desktop testing
  window.addEventListener('keydown', (e)=>{
    if(e.key==='ArrowUp') trySetDir(0,-1);
    if(e.key==='ArrowDown') trySetDir(0,1);
    if(e.key==='ArrowLeft') trySetDir(-1,0);
    if(e.key==='ArrowRight') trySetDir(1,0);
    if(e.key===' ' && !running) resetGame();
  });

  function trySetDir(x,y){
    // prevent opposite direction; also ignore same direction
    if((x === -dir.x && y === -dir.y) || (x===dir.x && y===dir.y)) return;
    pendingDir = {x,y};
  }

  restartBtn.addEventListener('click', resetGame);

  window.addEventListener('resize', debounce(resizeCanvas, 120));
  loadHigh();
  resizeCanvas();
  resetGame();

  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden) stopTick(); else if(running) startTick();
  });

  function debounce(fn, ms){
    let t;
    return function(...a){
      clearTimeout(t);
      t = setTimeout(()=>fn.apply(this,a), ms);
    };
  }

  // light continuous draw so head/food always visible
  function rafLoop(){ draw(); requestAnimationFrame(rafLoop); }
  requestAnimationFrame(rafLoop);

})();
</script>
</body>
</html>
