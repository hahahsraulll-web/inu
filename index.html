<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Labirin - Escape Maze</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: #f0f0f0;
            padding: 10px 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-box span {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }

        #gameCanvas {
            background: #f9f9f9;
            border: 3px solid #667eea;
            border-radius: 10px;
            display: block;
            margin: 20px auto;
            touch-action: none;
            cursor: pointer;
        }

        .controls {
            text-align: center;
            margin-bottom: 15px;
        }

        .control-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        button {
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .arrow-btn {
            font-size: 20px;
        }

        #resetBtn {
            width: 100%;
            background: #ff6b6b;
            font-size: 16px;
        }

        #resetBtn:hover {
            background: #ff5252;
        }

        .info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            margin-top: 15px;
            font-size: 14px;
            color: #333;
        }

        .info p {
            margin: 5px 0;
        }

        .success-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            z-index: 1000;
        }

        .success-message.show {
            display: block;
            animation: popIn 0.5s ease;
        }

        .success-message h2 {
            color: #4caf50;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .success-message p {
            color: #666;
            margin-bottom: 20px;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .overlay.show {
            display: block;
        }

        @keyframes popIn {
            0% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            .header h1 {
                font-size: 24px;
            }

            #gameCanvas {
                max-width: 100%;
            }

            .stats {
                gap: 5px;
            }

            .stat-box {
                padding: 8px 12px;
                font-size: 12px;
            }

            .stat-box span {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Escape Maze</h1>
            <p>Bantu orang keluar dari labirin!</p>
        </div>

        <div class="stats">
            <div class="stat-box">
                <label>Level</label>
                <span id="levelDisplay">1</span>
            </div>
            <div class="stat-box">
                <label>Gerak</label>
                <span id="movesDisplay">0</span>
            </div>
            <div class="stat-box">
                <label>Waktu</label>
                <span id="timerDisplay">0s</span>
            </div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls">
            <div class="control-buttons">
                <div></div>
                <button class="arrow-btn" onclick="moveUp()">⬆️</button>
                <div></div>
                <button class="arrow-btn" onclick="moveLeft()">⬅️</button>
                <button class="arrow-btn" onclick="moveDown()">⬇️</button>
                <button class="arrow-btn" onclick="moveRight()">➡️</button>
            </div>
            <button id="resetBtn" onclick="resetGame()">🔄 Mulai Ulang</button>
        </div>

        <div class="info">
            <p><strong>🎯 Tujuan:</strong> Gerakkan pemain (biru) ke pintu keluar (hijau)</p>
            <p><strong>⚠️ Hindari:</strong> Dinding hitam dan musuh merah</p>
            <p><strong>📱 Kontrol:</strong> Gunakan tombol panah atau sentuh layar</p>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="success-message" id="successMessage">
        <h2>🎉 Selamat!</h2>
        <p id="completionStats"></p>
        <button onclick="nextLevel()" style="margin-top: 10px;">Level Selanjutnya ➡️</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Responsive canvas
        function resizeCanvas() {
            const containerWidth = canvas.parentElement.offsetWidth - 20;
            if (containerWidth < 400) {
                canvas.width = containerWidth;
                canvas.height = containerWidth;
            }
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game variables
        let gameState = {
            level: 1,
            playerX: 1,
            playerY: 1,
            moves: 0,
            startTime: Date.now(),
            isGameOver: false,
            maze: [],
            gridSize: 10,
            enemies: []
        };

        const TILE_SIZE = canvas.width / gameState.gridSize;

        // Maze generator
        function generateMaze(difficulty) {
            const maze = Array(gameState.gridSize).fill(null).map(() => 
                Array(gameState.gridSize).fill(0)
            );

            // Buat dinding random berdasarkan level
            const wallDensity = 0.3 + (difficulty * 0.05);
            for (let i = 0; i < gameState.gridSize; i++) {
                for (let j = 0; j < gameState.gridSize; j++) {
                    if ((i === 0 || j === 0 || i === gameState.gridSize - 1 || j === gameState.gridSize - 1)) {
                        maze[i][j] = 1; // Border
                    } else if (Math.random() < wallDensity) {
                        maze[i][j] = 1; // Wall
                    }
                }
            }

            // Pastikan starting point
            maze[1][1] = 0;
            maze[gameState.gridSize - 2][gameState.gridSize - 2] = 0;

            return maze;
        }

        // Generate enemies
        function generateEnemies() {
            gameState.enemies = [];
            const enemyCount = 1 + Math.floor(gameState.level / 2);
            for (let i = 0; i < enemyCount; i++) {
                gameState.enemies.push({
                    x: Math.floor(Math.random() * (gameState.gridSize - 4)) + 2,
                    y: Math.floor(Math.random() * (gameState.gridSize - 4)) + 2,
                    dx: Math.random() > 0.5 ? 1 : -1,
                    dy: Math.random() > 0.5 ? 1 : -1
                });
            }
        }

        // Initialize game
        function initGame() {
            gameState.playerX = 1;
            gameState.playerY = 1;
            gameState.moves = 0;
            gameState.startTime = Date.now();
            gameState.isGameOver = false;
            gameState.maze = generateMaze(gameState.level);
            generateEnemies();
            document.getElementById('levelDisplay').textContent = gameState.level;
            document.getElementById('movesDisplay').textContent = '0';
        }

        // Check collision
        function canMove(x, y) {
            if (x < 0 || x >= gameState.gridSize || y < 0 || y >= gameState.gridSize) return false;
            if (gameState.maze[y][x] === 1) return false;
            
            // Check enemy collision
            for (let enemy of gameState.enemies) {
                if (enemy.x === x && enemy.y === y) return false;
            }
            
            return true;
        }

        // Move player
        function movePlayer(dx, dy) {
            if (gameState.isGameOver) return;

            const newX = gameState.playerX + dx;
            const newY = gameState.playerY + dy;

            if (canMove(newX, newY)) {
                gameState.playerX = newX;
                gameState.playerY = newY;
                gameState.moves++;
                document.getElementById('movesDisplay').textContent = gameState.moves;

                // Check win condition
                if (gameState.playerX === gameState.gridSize - 2 && 
                    gameState.playerY === gameState.gridSize - 2) {
                    winGame();
                }
            }
        }

        // Move enemies
        function moveEnemies() {
            for (let enemy of gameState.enemies) {
                let newX = enemy.x + enemy.dx;
                let newY = enemy.y + enemy.dy;

                if (!canMove(newX, newY)) {
                    enemy.dx *= -1;
                    enemy.dy *= -1;
                    newX = enemy.x + enemy.dx;
                    newY = enemy.y + enemy.dy;
                }

                enemy.x = newX;
                enemy.y = newY;

                // Check player collision
                if (enemy.x === gameState.playerX && enemy.y === gameState.playerY) {
                    gameOver();
                }
            }
        }

        // Draw game
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const tileSize = canvas.width / gameState.gridSize;

            // Draw maze
            for (let i = 0; i < gameState.gridSize; i++) {
                for (let j = 0; j < gameState.gridSize; j++) {
                    if (gameState.maze[i][j] === 1) {
                        ctx.fillStyle = '#333';
                        ctx.fillRect(j * tileSize, i * tileSize, tileSize, tileSize);
                    }
                }
            }

            // Draw exit (goal)
            ctx.fillStyle = '#4caf50';
            ctx.fillRect(
                (gameState.gridSize - 2) * tileSize,
                (gameState.gridSize - 2) * tileSize,
                tileSize,
                tileSize
            );
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${tileSize * 0.6}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🚪', (gameState.gridSize - 1.5) * tileSize, (gameState.gridSize - 1.5) * tileSize);

            // Draw enemies
            for (let enemy of gameState.enemies) {
                ctx.fillStyle = '#ff6b6b';
                ctx.fillRect(enemy.x * tileSize, enemy.y * tileSize, tileSize, tileSize);
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${tileSize * 0.6}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('👹', (enemy.x + 0.5) * tileSize, (enemy.y + 0.5) * tileSize);
            }

            // Draw player
            ctx.fillStyle = '#2196F3';
            ctx.fillRect(gameState.playerX * tileSize, gameState.playerY * tileSize, tileSize, tileSize);
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${tileSize * 0.6}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('😊', (gameState.playerX + 0.5) * tileSize, (gameState.playerY + 0.5) * tileSize);
        }

        // Game loop
        function gameLoop() {
            if (!gameState.isGameOver) {
                moveEnemies();
                draw();

                // Update timer
                const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
                document.getElementById('timerDisplay').textContent = elapsed + 's';
            }
            requestAnimationFrame(gameLoop);
        }

        // Win game
        function winGame() {
            gameState.isGameOver = true;
            const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
            document.getElementById('completionStats').innerHTML = 
                `Level ${gameState.level} selesai!<br>Gerak: ${gameState.moves} | Waktu: ${elapsed}s`;
            document.getElementById('overlay').classList.add('show');
            document.getElementById('successMessage').classList.add('show');
        }

        // Game over
        function gameOver() {
            gameState.isGameOver = true;
            document.getElementById('completionStats').innerHTML = 
                `<span style="color: #ff6b6b;">Game Over! Tertangkap musuh!</span><br>Coba lagi...`;
            document.getElementById('overlay').classList.add('show');
            document.getElementById('successMessage').classList.add('show');
        }

        // Next level
        function nextLevel() {
            gameState.level++;
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
            initGame();
            gameLoop();
        }

        // Reset game
        function resetGame() {
            gameState.level = 1;
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
            initGame();
        }

        // Movement functions
        function moveUp() { movePlayer(0, -1); }
        function moveDown() { movePlayer(0, 1); }
        function moveLeft() { movePlayer(-1, 0); }
        function moveRight() { movePlayer(1, 0); }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') { moveUp(); e.preventDefault(); }
            if (e.key === 'ArrowDown') { moveDown(); e.preventDefault(); }
            if (e.key === 'ArrowLeft') { moveLeft(); e.preventDefault(); }
            if (e.key === 'ArrowRight') { moveRight(); e.preventDefault(); }
        });

        // Touch controls
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) moveRight();
                else moveLeft();
            } else {
                if (diffY > 0) moveDown();
                else moveUp();
            }
        });

        // Start game
        initGame();
        gameLoop();
    </script>
</body>
</html>
